name: Build docker image

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - 'master'
      - 'stagign*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python_version: "3.10"
            odoo_version: "16.0"
            # odoo_org_repo: "oca/ocb"
            image_name: py3.10-bin    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2.2.1
      - name: Login to ghcr.io
        uses: docker/login-action@v2.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v3
        with:
          build-args: |
            python_version=${{ matrix.python_version }}
            odoo_version=${{ matrix.odoo_version }}
            odoo_org_repo=${{ matrix.odoo_org_repo }}
            setuptools_constraint=${{ matrix.setuptools_constraint }}
          tags: |
            ${{ github.repository_owner }}/${{ matrix.image_name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
          cache-from: type=registry,ref=${{ github.repository_owner }}/${{ matrix.image_name }}:latest
          cache-to: type=local,dest=/tmp/.buildx-cache
          push: true
  odoo-test:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - python_version: "3.10"
            odoo_version: "16.0"
            # odoo_org_repo: "oca/ocb"
            image_name: py3.10-bin
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Login to ghcr.io
        uses: docker/login-action@v2.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: run test odoo
        run: docker run -v integra:/mnt/integra-addons -v custom:/mnt/custom-addons 
          --network=host -e PGHOST=localhost ${{ github.repository_owner }}/${{ matrix.image_name }}:latest odoo --test-enable -i estate --stop-after-init
      
      
  
